run:
  tests: false
  timeout: 5m

linters:
  disable-all: true
  # Enable specific linter
  # https://golangci-lint.run/usage/linters/#enabled-by-default-linters
  enable:
    - asciicheck
    - bidichk
    - durationcheck
    - errcheck
    - errname
    - forbidigo
    - usetesting
    - forcetypeassert
    - goconst
    - gofmt
    - goimports
    - goheader
    - gomodguard
    - goprintffuncname
    - gosimple
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilnil
    - promlinter
    - staticcheck
    - stylecheck
    - thelper
    - tparallel
    - typecheck
    - thelper
    - unconvert
    - unused
    - whitespace
    - unparam
    - revive

linters-settings:
  forbidigo:
    analyze-types: true
    forbid:
      # Unstable sorts may order equal elements differently across Go releases,
      # which forks consensus between nodes built with different toolchains.
      - p: ^sort\.(Slice|Sort)$
        msg: "unstable sort is not deterministic across Go versions; use sort.SliceStable / sort.Stable"
      - p: ^slices\.SortFunc$
        msg: "unstable sort is not deterministic across Go versions; use slices.SortStableFunc"
  revive:
    rules:
      - name: function-result-limit
        severity: warning
        disabled: false
        # limits the number of returns to 4
        arguments: [4]

issues:
  exclude-rules:
    # Historical upgrade handlers have already executed on-chain; leave them untouched.
    - path: app/upgrades/
      linters:
        - forbidigo
    - linters:
        - staticcheck
      text: "SA1024: cutset contains duplicate characters" # proved to not provide much value, only false positives.
    - linters:
        - staticcheck
      text: "SA9004: only the first constant in this group has an explicit type" # explicitly recommended in go syntax
    - linters:
        - stylecheck
      text: "ST1003:" # requires identifiers with "id" to be "ID".
    - linters:
        - stylecheck
      text: "ST1005:" # punctuation in error messages
  max-issues-per-linter: 10000
  max-same-issues: 10000
