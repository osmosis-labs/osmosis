name: Update Docs

# The swagger spec only changes when the protos, the pinned proto
# dependencies or the generation scripts change, so regenerate on those
# pushes to main instead of on a timer.
on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "scripts/makefiles/proto.mk"
      - "scripts/generate-docs.sh"
      - "client/docs/config.json"
      - "client/docs/yarn.lock"
      - ".github/workflows/generate-docs.yml"
  workflow_dispatch:

# Runs for back-to-back pushes all write docs-update-branch, so cancel the
# older one and let the newest main win.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Protoc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler

      - name: Install Protoc-gen-swagger
        run: |
          go install github.com/grpc-ecosystem/grpc-gateway/protoc-gen-swagger@v1.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/docs/yarn.lock

      - name: Install documentation dependencies
        run: |
          yarn --cwd client/docs install --frozen-lockfile
          echo "${{ github.workspace }}/client/docs/node_modules/.bin" >> $GITHUB_PATH

      - name: Install Statik
        run: |
          sudo apt-get update -y
          sudo apt-get install -y golang-statik

      - name: Install Buf
        run: |
          curl -sSL https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64 -o buf
          chmod +x buf
          sudo mv buf /usr/local/bin

      - name: Download dependencies
        run: go mod download

      - name: Run make docs
        run: |
          make docs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update docs
          title: "Update docs"
          body: "Update docs"
          branch: "docs-update-branch"
